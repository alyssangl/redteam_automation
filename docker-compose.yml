# Hybrid lab, container half: the framework + the Kali attacker.
# The Metasploitable 3 TARGET is a VM (see Vagrantfile) — it CANNOT be a
# container, because the privesc kernel exploits need a real guest kernel 3.13.
# See REPRODUCIBILITY.md for the networking (how the Kali container reaches the
# VM target) and first-run steps.

services:
  kali:
    build:
      context: .
      dockerfile: docker/Dockerfile.kali
    image: lgg-kali
    container_name: lgg-kali
    # Auto-restart the container (and thus a FRESH msfrpcd) if it or the Docker
    # engine drops; the entrypoint also supervises/restarts msfrpcd in-container.
    restart: unless-stopped
    # nmap's binary is setcap'd (cap_net_raw) for SYN/OS scans; without these
    # caps in the container's bounding set, execing it fails with EPERM (exit 126,
    # "Operation not permitted"). Grant raw-socket caps so recon nmap works.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      MSF_USER: ${MSF_USER:-kali}
      MSF_PASS: ${MSF_PASS:-kali}
      MSF_PORT: ${MSF_PORT:-55553}
    ports:
      - "55553:55553"   # msfrpcd, exposed to host (optional; app reaches it via the 'lab' net)
      - "2222:22"       # sshd, exposed to host on 2222 (optional)
      # Reverse-shell handler port: the VM target dials back to the host-only
      # adapter (192.168.34.1:4444/4445); Docker forwards it here to the handler
      # bound at 0.0.0.0 inside the container (payloads set ReverseListenerBindAddress=0.0.0.0).
      - "4444:4444"
      - "4445:4445"
    networks:
      - lab

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    image: lgg-app
    container_name: lgg-app
    depends_on:
      - kali
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      # Reach the Kali service by its compose DNS name (override in .env if needed).
      KALI_IP: ${KALI_IP:-kali}
      TARGET_IP: ${TARGET_IP:-192.168.34.7}
      # Reverse-shell callback address: the VirtualBox host-only adapter the
      # target VM can reach. Docker publishes the handler ports (4444/4445) here
      # so the target's callback to 192.168.34.1 lands in the Kali container.
      LHOST: ${LHOST:-192.168.34.1}
      KALI_USER: ${KALI_USER:-kali}
      KALI_PASS: ${KALI_PASS:-kali}
      MSF_PORT: ${MSF_PORT:-55553}
      MSF_USER: ${MSF_USER:-kali}
      MSF_PASS: ${MSF_PASS:-kali}
    volumes:
      - .:/app                 # live code (edit on host, run in container)
      - lgg-db:/app/databases  # persist the RAG DB across runs
    networks:
      - lab
    stdin_open: true
    tty: true

networks:
  lab:
    driver: bridge

volumes:
  lgg-db:
